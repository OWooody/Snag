<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "SF Pro Display", system-ui, sans-serif; background: #F4F3F8; color: #1B1B24; padding: 48px; width: 1600px; }
  h1 { font-size: 28px; font-weight: 700; margin-bottom: 32px; letter-spacing: -0.02em; }
  .row { display: grid; grid-template-columns: 56px 200px 150px 1fr 1fr; gap: 28px; align-items: center; background: #fff; border-radius: 24px; padding: 28px; margin-bottom: 24px; }
  .label { font-size: 44px; font-weight: 800; color: #5B4CF5; }
  .name { font-size: 15px; color: #71717A; margin-top: 10px; }
  .big img { width: 180px; height: 180px; display: block; }
  .sizes { display: flex; gap: 14px; align-items: flex-end; }
  .sizes img { display: block; }
  .lockup { display: flex; align-items: center; gap: 18px; border-radius: 18px; padding: 28px 32px; height: 140px; }
  .lockup img { width: 72px; height: 72px; }
  .lockup .word { display: block; font-size: 64px; line-height: 1; font-weight: 800; letter-spacing: -0.045em; }
  .light { background: #fff; border: 1px solid #E7E5EF; }
  .dark { background: #0D1117; color: #fff; }
  .tag { display: block; font-size: 15px; font-weight: 500; letter-spacing: 0; color: #71717A; margin-top: 4px; }
  .dark .tag { color: #8B949E; }
</style>
</head>
<body>
  <h1>Snag logo options</h1>
  <div class="row">
    <div class="label">A<div class="name">Tab</div></div>
    <div class="big"><img src="a-tab.svg"></div>
    <div class="sizes"><img src="a-tab.svg" width="64"><img src="a-tab.svg" width="32"><img src="a-tab.svg" width="16"></div>
    <div class="lockup light"><img src="a-tab.svg"><div><span class="word">snag</span><span class="tag">Tap the screen, it gets fixed.</span></div></div>
    <div class="lockup dark"><img src="a-tab.svg"><div><span class="word">snag</span><span class="tag">Tap the screen, it gets fixed.</span></div></div>
  </div>
  <div class="row">
    <div class="label">B<div class="name">Hook S</div></div>
    <div class="big"><img src="b-hook.svg"></div>
    <div class="sizes"><img src="b-hook.svg" width="64"><img src="b-hook.svg" width="32"><img src="b-hook.svg" width="16"></div>
    <div class="lockup light"><img src="b-hook.svg"><div><span class="word">snag</span><span class="tag">Tap the screen, it gets fixed.</span></div></div>
    <div class="lockup dark"><img src="b-hook.svg"><div><span class="word">snag</span><span class="tag">Tap the screen, it gets fixed.</span></div></div>
  </div>
  <div class="row">
    <div class="label">C<div class="name">Tap spark</div></div>
    <div class="big"><img src="c-tap.svg"></div>
    <div class="sizes"><img src="c-tap.svg" width="64"><img src="c-tap.svg" width="32"><img src="c-tap.svg" width="16"></div>
    <div class="lockup light"><img src="c-tap.svg"><div><span class="word">snag</span><span class="tag">Tap the screen, it gets fixed.</span></div></div>
    <div class="lockup dark"><img src="c-tap.svg"><div><span class="word">snag</span><span class="tag">Tap the screen, it gets fixed.</span></div></div>
  </div>
</body>
</html>
